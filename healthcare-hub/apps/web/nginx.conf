# Serves the web build and proxies the API on the same origin, so the HttpOnly refresh cookie
# (SameSite=Strict) and the API origin check both see one site.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Evidence uploads go through /api/v1/evidence/blob/ (API limit 50 MB).
  client_max_body_size 52m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Connection '';
    # Live updates are a long-lived event stream.
    proxy_buffering off;
    proxy_read_timeout 360s;
  }

  location = /readyz {
    proxy_pass http://api:4000;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
